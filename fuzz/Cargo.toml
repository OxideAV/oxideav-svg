[package]
name = "oxideav-svg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The `text` feature is on so the `text` target can shape real glyphs;
# the other targets only touch the contract layer + the vector document
# API.
[dependencies.oxideav-svg]
path = ".."
default-features = false
features = ["text"]

# Builds the `FaceChain` the `text` target's font hook hands out.
[dependencies.oxideav-scribe]
version = "0.1.10"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

# Raw-bytes target: feed arbitrary input at `probe` / `info` /
# `decode` / `decode_with` / `decode_rgb8` / `decode_rgba8` / `parse` /
# `parse_with` / `parse_with_extras` / `parse_at`. Liveness only — the
# parser must return a `Result` for any input, never panic / abort /
# OOM (the `DecodeOptions` defaults bound inflation, element count and
# nesting depth).
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

# Writer fixed-point target: for any input the parser accepts,
# `write(parse(write(parse(x)))) == write(parse(x))` (plain and with
# the `PreservedExtras` side-channel), and the `.svgz` path inflates
# back to the plain bytes.
[[bin]]
name = "write_roundtrip"
path = "fuzz_targets/write_roundtrip.rs"
test = false
doc = false

# Text layout target: a font hook is installed, so `<text>` /
# `<tspan>` / `<textPath>` run the whole SVG 2 chapter 11 pipeline
# (white space, bidi, shaping, positioning, path placement, paint
# servers, decorations) on hostile markup. Liveness only.
[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
