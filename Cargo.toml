[package]
name = "oxideav-svg"
version = "0.1.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-svg"
homepage = "https://github.com/OxideAV/oxideav-svg"
authors = ["Mark Karpeles"]
description = "Pure-Rust SVG (read + write): framework-free vector document API following the OxideAV image-crate contract, with optional oxideav framework integration"
readme = "README.md"
keywords = ["multimedia", "image", "svg", "vector", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]
# crates.io 10 MiB package cap: fixtures and fuzz corpora stay out.
exclude = ["/tests", "/fuzz"]

[features]
default = ["registry", "text"]
# Framework integration: `register` / `make_decoder` / `make_encoder`,
# the `Frame::Vector` codec adapters, the `.svg` / `.svgz` demuxer +
# muxer, and the `SvgDocument` <-> `oxideav_core::VectorFrame` bridge.
# Off, the crate is the image-crate contract's standalone layer plus
# the vector document API (`parse` / `write` / `SvgDocument`) with no
# `oxideav-core` in the dependency tree.
registry = ["dep:oxideav-core"]
# `text` enables `<text>` / `<tspan>` / `<textPath>` parsing via
# oxideav-scribe's vector-first API (`Face::glyph_node`), which hands
# back framework scene nodes — so `text` implies `registry`.
text = ["dep:oxideav-scribe", "registry"]

[dependencies]
# Optional behind the default-on `registry` feature (IMAGE_CRATE_API):
# image-library consumers use `default-features = false` to skip the
# framework dependency tree entirely. `Node::SoftMask` + `MaskKind`
# (used by the `<mask>` / `<clipPath>` bridge) need oxideav-core 0.1.15+.
oxideav-core = { version = "0.1", optional = true }
# Vector-text APIs (`Face::glyph_node` + `Shaper::shape_to_paths`) land
# in 0.1.1; gated behind the `text` feature so the SVG crate stays
# usable when callers don't need text shaping.
oxideav-scribe = { version = "0.1.1", optional = true }
# `.svgz` (gzip-compressed SVG, RFC 1952) inflate / deflate through the
# workspace's compression provider. Only the gzip algorithm is needed;
# the capped decoder is the decompression-bomb guard.
compcol = { version = "0.6", default-features = false, features = ["gzip"] }
# `Stylesheet::resolve_imports` emits `log::debug!` lines when an
# `@import` is skipped (fetcher returned None / cycle / depth cap
# reached). The crate is otherwise silent.
log = "0.4"
# `<image>` element with embedded `data:image/...;base64,...` URI
# decoding. `STANDARD` engine implements RFC 4648 §4 — no padding
# tolerance is acceptable for the data-URI subset.
base64 = { version = "0.22", default-features = false, features = ["std"] }
