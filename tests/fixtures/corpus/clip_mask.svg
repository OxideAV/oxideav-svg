<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <defs>
    <clipPath id="clip" clipPathUnits="userSpaceOnUse" clip-rule="evenodd">
      <rect x="0" y="0" width="40" height="40"/>
      <circle cx="40" cy="40" r="20"/>
    </clipPath>
    <mask id="msk" maskUnits="objectBoundingBox" mask-type="alpha">
      <rect x="0" y="0" width="120" height="120" fill="#ffffff"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="80" height="80" fill="#204060" clip-path="url(#clip)"/>
  <circle cx="80" cy="80" r="30" fill="#602020" mask="url(#msk)"/>
</svg>
